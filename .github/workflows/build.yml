name: Build

on:
  # No tag trigger: a release creates its v1.2.3 tag, and with RELEASE_TOKEN that tag push would
  # start this workflow again, which re-published the release in a loop.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release with this version (e.g. 1.0.0); leave empty for a normal build'
        required: false
        default: ''

# Least privilege by default: read-only everywhere, and only the release job may write.
permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          RELEASE: ${{ github.event.inputs.release }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # A push to main whose commit message starts with "Release v1.2.3" publishes that version,
          # as does a manual run with a version.
          release="${RELEASE#v}"
          first_line="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n1)"
          if [ -z "$release" ] && [ "$GITHUB_REF" = refs/heads/main ] && [[ "$first_line" =~ ^Release\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            release="${BASH_REMATCH[1]}"
          fi
          if [ -n "$release" ]; then
            echo "version=$release" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=1.0.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  core-tests-linux:
    name: Core tests (Linux, with ffmpeg/pandoc/LibreOffice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Install converters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg pandoc libreoffice-writer libreoffice-calc libreoffice-impress
      - name: Test
        run: dotnet test tests/Dropit.Tests -c Release --logger "console;verbosity=normal"

  windows:
    name: Windows build, tests and installer
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Download ffmpeg and pandoc (for the tests; the app downloads them on demand)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-tools.ps1 -Destination tools

      - name: Test (Windows)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\tools;$env:PATH"
          dotnet test tests/Dropit.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish src/Dropit.App/Dropit.App.csproj -c Release -r win-x64 --self-contained -p:Version=$env:VERSION -o publish
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md publish/

      - name: UI self-test
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'self-test'
          $p = Start-Process -FilePath "$PWD\publish\Dropit.exe" -ArgumentList '--self-test', "`"$out`"" -Wait -PassThru
          Get-Content (Join-Path $out 'self-test.txt') -ErrorAction Continue
          if ($p.ExitCode -ne 0) {
            # A crash that bypasses .NET exception handling is only reported in the event log.
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = '.NET Runtime', 'Application Error' } -MaxEvents 4 -ErrorAction SilentlyContinue | Format-List TimeCreated, Message
            throw "Self-test failed with exit code $($p.ExitCode)"
          }

      - name: Measure size and idle resource use
        shell: pwsh
        run: |
          function Size($path) { (Get-ChildItem $path -Recurse -File | Measure-Object Length -Sum).Sum / 1MB }
          "Publish folder (app + trimmed .NET runtime): {0:N1} MB" -f (Size publish)
          Get-ChildItem publish -File | Sort-Object Length -Descending | Select-Object -First 8 | ForEach-Object { "  {0}: {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

          # Start like after sign-in (no first-run window) and sample memory and CPU while idle.
          New-Item -ItemType Directory -Force "$env:APPDATA\Dropit" | Out-Null
          '{ "FirstRunDone": true, "CheckForUpdates": false }' | Set-Content "$env:APPDATA\Dropit\settings.json"
          $p = Start-Process -FilePath "$PWD\publish\Dropit.exe" -ArgumentList '--background' -PassThru
          Start-Sleep -Seconds 15
          $p.Refresh(); $cpu1 = $p.TotalProcessorTime
          Start-Sleep -Seconds 30
          $p.Refresh()
          "Idle after 45 s: working set {0:N1} MB, private {1:N1} MB, CPU while idle {2:N2} s in 30 s" -f ($p.WorkingSet64 / 1MB), ($p.PrivateMemorySize64 / 1MB), ($p.TotalProcessorTime - $cpu1).TotalSeconds
          Stop-Process -Id $p.Id -Force
          Remove-Item "$env:APPDATA\Dropit" -Recurse -Force

      - name: Installer and zip
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress --require-checksums
          }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          & $iscc "/DAppVersion=$env:VERSION" installer/Dropit.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          7z a -tzip -mx=9 "artifacts/Dropit-$env:VERSION-win-x64.zip" ./publish/* | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip failed" }
          Get-ChildItem artifacts | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          $setup = Get-Item "artifacts/Dropit-Setup-$env:VERSION.exe"
          if ($setup.Length -gt 50MB) { throw ("The installer grew to {0:N1} MB (limit 50 MB)" -f ($setup.Length / 1MB)) }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dropit-windows
          path: artifacts/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-previews
          path: self-test

  linux:
    name: Linux build and package
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish src/Dropit.Linux/Dropit.Linux.csproj -c Release -r linux-x64 --self-contained -p:Version=$VERSION -o publish-linux
      - name: Self-test and command line
        run: |
          ./publish-linux/dropit --version
          ./publish-linux/dropit --self-test self-test-linux
          cat self-test-linux/self-test.txt
          cp self-test-linux/en/wheel-actions.png /tmp/sample.png
          ./publish-linux/dropit list /tmp/sample.png
          ./publish-linux/dropit run image.to.jpg /tmp/sample.png
          test -s /tmp/sample.jpg
      - name: Package
        run: |
          packaging/make-linux-package.sh "$VERSION" publish-linux dist
          ls -la dist
          # The Arch job below rewrites source= to the local tarball before makepkg, so the URL that
          # actually ships to users and to the AUR is never exercised by the build. This fork renamed
          # the project once and the download URL kept pointing at the upstream repository, where the
          # tag does not exist: makepkg then 404s on a PKGBUILD that had passed every job.
          grep -q 'releases/download/' dist/PKGBUILD || { echo "PKGBUILD has no download URL in source="; exit 1; }
          grep -q 'github.com/'"$GITHUB_REPOSITORY" dist/PKGBUILD || { echo "::error::PKGBUILD source points somewhere other than $GITHUB_REPOSITORY"; sed -n '1,20p' dist/PKGBUILD; exit 1; }
          du -sh publish-linux
          size=$(stat -c %s dist/*.tar.xz)
          if [ "$size" -gt $((50 * 1024 * 1024)) ]; then echo "The tarball grew to $((size / 1048576)) MB (limit 50 MB)"; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dropit-linux
          path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ui-previews-linux
          path: self-test-linux

  arch:
    name: Arch Linux package (makepkg, install, run)
    needs: [version, linux]
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Dropit-linux
          path: dist
      - name: Build and install with makepkg
        run: |
          pacman -Syu --noconfirm --needed base-devel
          useradd -m builder
          mkdir -p /build
          cp dist/*.tar.xz /build/
          tarball="$(basename dist/*.tar.xz)"
          # Same PKGBUILD as on the AUR, but taking the tarball from this run instead of the release.
          sed "s|^source=.*|source=(\"$tarball\")|" dist/PKGBUILD > /build/PKGBUILD
          chown -R builder /build
          (source /build/PKGBUILD && pacman -S --noconfirm --needed "${depends[@]}")
          su builder -c "cd /build && makepkg --noconfirm"
          pacman -U --noconfirm /build/dropit-bin-*.pkg.tar.zst
      - name: Run the installed app
        run: |
          dropit --version
          test -f /usr/share/applications/dropit.desktop
          test -f /usr/share/kio/servicemenus/dropit.desktop
          su builder -c "dropit --self-test /tmp/arch-self-test" && cat /tmp/arch-self-test/self-test.txt
          su builder -c "cp /tmp/arch-self-test/en/wheel-image-convert.png /tmp/sample.png && dropit run image.to.webp /tmp/sample.png && test -s /tmp/sample.webp"
      - name: AUR metadata
        run: |
          mkdir -p aur
          cp dist/PKGBUILD aur/
          chown -R builder aur
          su builder -c "cd aur && makepkg --printsrcinfo > .SRCINFO"
          cat aur/PKGBUILD aur/.SRCINFO
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aur
          path: aur
          include-hidden-files: true

  release:
    name: Publish release
    needs: [version, windows, linux, arch]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Dropit-windows
          path: artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Dropit-linux
          path: linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: aur
          path: aur
      - name: Check the release token
        id: token
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # With a RELEASE_TOKEN secret (a personal access token) the release is published under that
          # person's account; otherwise, or if the token can't be used, under github-actions.
          if [ -z "$GH_TOKEN" ]; then echo "No RELEASE_TOKEN secret: publishing as github-actions."; exit 0; fi
          if login="$(gh api user -q .login)" && [ "$(gh api "repos/$GITHUB_REPOSITORY" -q .permissions.push)" = true ]; then
            echo "Publishing as $login"
            echo "usable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::RELEASE_TOKEN can't write to this repository (expired or missing Contents: read and write); publishing as github-actions."
          fi
      - name: Release
        id: release
        continue-on-error: true
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ steps.token.outputs.usable == 'true' && secrets.RELEASE_TOKEN || github.token }}
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Dropit ${{ env.VERSION }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            artifacts/*
            linux/*.tar.xz
            linux/PKGBUILD
      - name: Release (as github-actions, if the token was refused)
        if: steps.release.outcome == 'failure'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          token: ${{ github.token }}
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Dropit ${{ env.VERSION }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            artifacts/*
            linux/*.tar.xz
            linux/PKGBUILD
      - name: Publish to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          # Needs an AUR account whose SSH public key matches the AUR_SSH_PRIVATE_KEY secret.
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then echo "No AUR_SSH_PRIVATE_KEY secret: skipping the AUR."; exit 0; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/dropit-bin.git aur-repo
          cp aur/PKGBUILD aur/.SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then echo "AUR is already up to date."; exit 0; fi
          git -c user.name="${{ github.repository_owner }}" -c user.email="${{ github.repository_owner }}@users.noreply.github.com" \
            commit -m "Update to $VERSION"
          git push origin HEAD:master
